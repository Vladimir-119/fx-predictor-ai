[project]
name = "fx-predictor-ai"
version = "0.3.0"
description = "Daily exchange-rate forecasting with FastAPI and MLflow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic-settings>=2.6.0,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "httpx>=0.28.0,<1.0",
    "mlflow-skinny==3.17.0",
    "pandas>=2.2,<4",
    "scikit-learn>=1.7,<2",
    "catboost>=1.2.10,<2",
    "python-dateutil>=2.9,<3",
    "tzdata>=2025.2",
    "faststream[rabbit]>=0.7,<0.8",
]

ml = [
    "matplotlib>=3.10,<4",
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.4,<5",
]

tracking = [
    "mlflow==3.17.0",
    "psycopg2-binary>=2.9,<3",
    "boto3>=1.35,<2",
]

[dependency-groups]
dev = [
    "mlflow==3.17.0",
    "ruff==0.15.12",
    "pre-commit>=4.2.0,<5.0",
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.25.0,<2.0",
    "pytest-cov>=6.0.0,<8.0",
    "httpx>=0.28.0,<1.0",
    "asgi-lifespan>=2.1.0,<3.0",
    "testcontainers[rabbitmq]>=4.13,<5",
    "psutil>=7,<8",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=95"
markers = ["integration: проверки настоящих сервисов и Docker/Testcontainers"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # ошибки оформления Python
    "W",   # предупреждения оформления
    "F",   # неиспользуемые импорты, неопределённые имена
    "I",   # порядок импортов
    "UP",  # современный синтаксис Python
    "N",   # соглашения по именованию
    "RUF", # дополнительные проверки Ruff
    "BLE", # слепой перехват исключений
    "ANN", # аннотации типов
]
ignore = ["RUF001", "RUF002", "RUF003"] # кириллица в текстах и комментариях

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

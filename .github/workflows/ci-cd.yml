name: CI / CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.19"

jobs:
  quality:
    name: Lint, format, tests, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Check lockfile and install dependencies
        run: |
          uv lock --check
          uv sync --frozen --extra web --group dev
      - name: Check all pre-commit hooks
        run: uv run --frozen --extra web pre-commit run --all-files
      - name: Ruff lint
        run: uv run --frozen --extra web ruff check .
      - name: Ruff format
        run: uv run --frozen --extra web ruff format --check .
      - name: Unit and API tests (coverage >= 95%, including branches)
        run: uv run --frozen --extra web pytest -q -m "not integration"
      - name: Read package version and validate release tag
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          uv run --frozen --extra web python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          from importlib.metadata import version

          app_version = version("fx-predictor-ai")
          ref = os.environ["RELEASE_REF"]
          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/")
              if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
                  raise SystemExit("Release tag must use vMAJOR.MINOR.PATCH")
              if tag != f"v{app_version}":
                  raise SystemExit(f"Release tag {tag} does not match package version {app_version}")
          print(f"version={app_version}")
          PY
      - name: Save coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn

  integration:
    name: Docker and real PostgreSQL
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_USER: fx_predictor
      POSTGRES_DB: fx_predictor_ai
      API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra web --group dev
      - name: Generate temporary database password
        run: |
          PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$PASSWORD"
          echo "POSTGRES_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Validate Compose and build the stack
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 120
      - name: Verify non-root user and absence of dev dependencies
        run: |
          test "$(docker compose exec -T app id -u)" = "10001"
          docker compose exec -T app python -c "import importlib.util; assert importlib.util.find_spec('pytest') is None; assert importlib.util.find_spec('ruff') is None"
      - name: Test healthy PostgreSQL
        env:
          EXPECT_POSTGRES: healthy
        run: uv run --frozen --extra web pytest -q -m integration --no-cov
      - name: Test PostgreSQL outage
        env:
          EXPECT_POSTGRES: unavailable
        run: |
          docker compose stop postgres
          uv run --frozen --extra web pytest -q -m integration --no-cov
      - name: Test recovery without restarting the app
        env:
          EXPECT_POSTGRES: healthy
        run: |
          docker compose up -d --wait --wait-timeout 120 postgres
          uv run --frozen --extra web pytest -q -m integration --no-cov
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down -v

  publish:
    name: Publish versioned image to GHCR
    needs: [quality, integration]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Prepare image name and tags
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          APP_VERSION: ${{ needs.quality.outputs.version }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY_OWNER,,}/fx-predictor-ai"
          if [ "$REF_TYPE" = "tag" ]; then
            ALIAS="$APP_VERSION"
          else
            ALIAS="edge"
          fi
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=$IMAGE:sha-$GITHUB_SHA,$IMAGE:$ALIAS" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.quality.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
          APP_VERSION: ${{ needs.quality.outputs.version }}
        run: |
          {
            echo "Published image: $IMAGE_NAME"
            echo "Tags: $IMAGE_TAGS"
            echo "Package version: $APP_VERSION"
            echo "Digest: $IMAGE_DIGEST"
            echo "Pull exact build: docker pull $IMAGE_NAME@$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

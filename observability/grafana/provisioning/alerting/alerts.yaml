apiVersion: 1
groups:
  - orgId: 1
    name: Pipeline
    folder: fx-predictor-ai
    interval: 10s
    rules:
      - uid: fx-queue-near-capacity
        title: QueueNearCapacity
        condition: B
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Task queue has exceeded 90% of its configured capacity for one minute
          description: A sustained backlog is actionable; short bursts are expected. The denominator is QUEUE_LIMIT, exported by the application.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 120
              to: 0
            model:
              refId: A
              expr: 'max(rabbitmq_detailed_queue_messages_ready{queue!~".+[.]dlq"}) / clamp_min(max(fx_queue_limit), 1) and on() (max(fx_queue_limit) > 0)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
                  operator:
                    type: and
                  reducer:
                    type: last
                    params: []
                  type: query
      - uid: fx-dlq-not-empty
        title: DeadLetterQueueNotEmpty
        condition: B
        for: 15s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A task requires investigation in the dead-letter queue
          description: Any quarantined task matters; a 15-second delay avoids firing on a transient scrape. The rule stays firing until the queue is investigated and drained.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 120
              to: 0
            model:
              refId: A
              expr: 'sum(rabbitmq_detailed_queue_messages_ready{queue=~".+[.]dlq"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
                    params: []
                  type: query
